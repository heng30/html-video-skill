<!-- 图文组件：左文右图，或右文左图。用于原文确实有配图的页面。
     字段：text 里的 p（两段以内）、figure 的 img（相对路径 images/img-XX.jpg）、figcaption（图注/来源）。
     图必须与论点直接相关；没有图就删掉 figure，改用 thesis / rows。 -->
<section class="slide image-slide slide-content" data-index="6">
  <div class="top">
    <span><span class="sec">06</span> · 图像</span>
    <span>栏目 · 图源</span>
  </div>
  <div class="rule"></div>

  <h2>先给判断，再让图作证</h2>
  <p class="dek">图只承担一个信息，不要把两张图塞进同一页。</p>

  <div class="body">
    <div class="image-body">
      <div class="text">
        <p>第一段解释图里发生了什么，只写看得见的事实。</p>
        <p>第二段说明它支撑本页的哪个判断，最多两段。</p>
      </div>
      <figure>
        <img src="images/img-01.jpg" alt="配图说明" />
        <figcaption>图注：内容 + 来源 + 时间。</figcaption>
      </figure>
    </div>
  </div>

  <div class="foot">
    <span>这张图证明了什么。</span>
    <span class="en">FIGURE / SOURCE</span>
  </div>
</section>
