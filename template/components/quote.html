<!-- 引语组件：幕间、论点、收尾。整页只放一段引语，不加第二个视觉主角。
     字段：quote-text（原文引语，保留出处语言）、quote-cn（中文翻译/解读）、
     quote-side（出处：作者 · 标题 · 年份）。
     引语必须真实可查；查不到就改用 thesis 组件，不要伪造。 -->
<section class="slide quote-slide slide-content" data-index="5">
  <div class="top">
    <span>幕间</span>
    <span>INTERLUDE</span>
  </div>
  <div class="rule"></div>

  <div class="quote-body">
    <div>
      <p class="quote-text">“原文引语，保留出处语言。<i>重点句可以斜体。</i>”</p>
      <p class="quote-cn">中文翻译或一句解读，说明它和本页论点的关系。</p>
    </div>
    <aside class="quote-side">
      <b>出处</b>作者 · 标题 · 年份
    </aside>
  </div>

  <div class="foot">
    <span>一句承接，把引语接回文章。</span>
    <span class="en">SOURCE</span>
  </div>
</section>
