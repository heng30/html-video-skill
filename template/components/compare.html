<!-- 对照组件：左右两栏或三栏，比较两种做法、前后变化、得失。
     字段：col 的 h3（栏标题）、big（可选的大数字/短结论）、p（解释）。
     两栏最稳；三栏只用于三项并列。不要在栏之间加竖线。 -->
<section class="slide compare-slide slide-content" data-index="4">
  <div class="top">
    <span><span class="sec">05</span> · 对照</span>
    <span>栏目 · 对比</span>
  </div>
  <div class="rule"></div>

  <h2>把两种做法放在同一屏上比较</h2>
  <p class="dek">两边用同一组维度，不要一边讲优点、一边讲缺点。</p>

  <div class="body">
    <div class="cols">
      <div class="col">
        <h3>过去 / 方案 A</h3>
        <div class="big">32px 数字或短结论</div>
        <p>同一维度下的表现。只写事实，不写评价。</p>
        <p class="note">来源或限定条件。</p>
      </div>
      <div class="col">
        <h3>现在 / 方案 B</h3>
        <div class="big">32px 数字或短结论</div>
        <p>同一维度下的表现，和左边可直接对比。</p>
        <p class="note">来源或限定条件。</p>
      </div>
    </div>
  </div>

  <div class="foot">
    <span>对比之后该选哪边。</span>
    <span class="en">COMPARE</span>
  </div>
</section>
